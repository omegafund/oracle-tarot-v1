<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결제 완료 — V55</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f1419; color: #d4d4d4; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 16px; }
.box { background: #1a1f2e; border: 1px solid #2c3447; border-radius: 8px; padding: 30px; text-align: center; max-width: 420px; width: 100%; }
h1 { color: #d4af37; font-size: 18px; margin-bottom: 8px; }
.spinner { width: 36px; height: 36px; border: 3px solid #2c3447; border-top-color: #d4af37; border-radius: 50%; animation: spin 1s linear infinite; margin: 16px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.msg { color: #8fa3c5; font-size: 13px; margin-top: 8px; }
.err { color: #f87171; font-size: 12px; margin-top: 16px; }
.hint { color: #d4af37; font-size: 12px; margin-top: 12px; line-height: 1.6; padding: 10px; background: #1f2638; border-radius: 4px; }
.btn { background: #d4af37; color: #0f1419; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; margin: 4px; }
</style>
</head>
<body>

<div class="box">
<h1>결제 검증 중...</h1>
<div class="spinner" id="spinner"></div>
<div class="msg" id="msg">잠시만 기다려 주세요</div>
<div class="err" id="err"></div>
<div class="hint" id="hint" style="display:none"></div>
<div id="btns" style="display:none">
<button class="btn" onclick="goHome()">홈으로</button>
</div>
</div>

<script>
var WORKER_URL = 'https://tarot-api-merged.omegafund01.workers.dev';
var ZEUSTAROT_HOME = 'https://zeustarot.com';

var V55_TO_V54_PLAN = {
    'entry':    'saju_basic',
    'premium':  'saju_premium',
    'month':    'month',
    'year':     'yearly',
    'lifetime': 'lifetime'
};

(async function () {
    var readingId = null;
    var signedAccessToken = null;
    var v55plan = null;
    
    try {
        var p = new URLSearchParams(window.location.search);
        
        var paymentKey = p.get('paymentKey');
        var orderId    = p.get('orderId');
        var amount     = p.get('amount');
        
        readingId         = p.get('rid') || p.get('readingId');
        signedAccessToken = p.get('token');
        v55plan           = p.get('plan') || 'premium';
        
        if (!paymentKey || !orderId || !amount) {
            throw new Error('토스 결제 파라미터 누락');
        }
        if (!readingId || !signedAccessToken) {
            throw new Error('readingId 또는 token URL 누락');
        }
        
        document.getElementById('msg').textContent = '결제 검증 중...';
        
        var confirmed = await Promise.race([
            fetch(WORKER_URL + '/v55/confirm-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    readingId:         readingId,
                    paymentKey:        paymentKey,
                    orderId:           orderId,
                    amount:            Number(amount),
                    signedAccessToken: signedAccessToken
                })
            }).then(function (res) { return res.json(); }),
            new Promise(function (_, reject) {
                setTimeout(function () { reject(new Error('TIMEOUT_15S')); }, 15000);
            })
        ]);
        
        if (!confirmed.valid) {
            throw new Error(confirmed.message || confirmed.error || '결제 검증 실패');
        }
        
        document.getElementById('msg').textContent = '점사 데이터 준비 중...';
        
        var sajuInput = null;
        var category = 'saju';
        
        try {
            var readingRes = await fetch(
                WORKER_URL + '/v55/fetch-reading?rid=' + encodeURIComponent(readingId) + 
                '&token=' + encodeURIComponent(signedAccessToken)
            );
            var readingData = await readingRes.json();
            sajuInput = readingData.sajuInput || readingData.input || null;
            category  = readingData.category || readingData.categoryHint || 'saju';
        } catch (fetchErr) {
            console.warn('[V55 success] fetch-reading 결함 (무시):', fetchErr.message);
        }
        
        try {
            localStorage.setItem('paid_token', 'V55_' + readingId);
            localStorage.setItem('oracleSessionToken', signedAccessToken);
            
            if (category === 'saju') {
                localStorage.setItem('sajuPaymentContext', 'true');
                sessionStorage.setItem('sajuPaymentContext', 'true');
            }
            
            var paidExpiresAt = Date.now() + (60 * 60 * 1000);
            localStorage.setItem('sajuPaidExpiresAt', String(paidExpiresAt));
            localStorage.setItem('verifiedAt', String(Date.now()));
        } catch (e) {}
        
        if (sajuInput && sajuInput.year) {
            try {
                var v54Gender = (sajuInput.gender === 'female' || sajuInput.gender === '여' || sajuInput.gender === 'F') ? 'female' : 'male';
                
                var sajuPendingResult = {
                    input: {
                        year:     Number(sajuInput.year),
                        month:    Number(sajuInput.month),
                        day:      Number(sajuInput.day),
                        hour:     (sajuInput.hour !== undefined && sajuInput.hour !== null && sajuInput.hour !== '') ? Number(sajuInput.hour) : null,
                        minute:   Number(sajuInput.minute || 0),
                        gender:   v54Gender,
                        calendar: sajuInput.calendar === 'lunar' ? 'lunar' : 'solar',
                        isLunar:  sajuInput.calendar === 'lunar' || !!sajuInput.isLunar
                    },
                    category:  category,
                    timePhase: 'medium'
                };
                
                localStorage.setItem('sajuPendingResult', JSON.stringify(sajuPendingResult));
                sessionStorage.setItem('sajuPendingResult', JSON.stringify(sajuPendingResult));
            } catch (e) {}
        }
        
        var v54Plan = V55_TO_V54_PLAN[v55plan] || 'saju_premium';
        try {
            localStorage.setItem('sajuPaidPlan', v54Plan);
            sessionStorage.setItem('sajuPaidPlan', v54Plan);
        } catch (e) {}
        
        document.getElementById('msg').textContent = '결제 완료 — 점사창으로 이동';
        document.getElementById('spinner').style.display = 'none';
        
        var v54Ctx = 'saju';
        if (category === 'love')    v54Ctx = 'love';
        if (category === 'stock')   v54Ctx = 'stock';
        if (category === 'crypto')  v54Ctx = 'crypto';
        if (category === 'general') v54Ctx = 'general';
        
        var v54Url = ZEUSTAROT_HOME + '/?paid=ok&ctx=' + encodeURIComponent(v54Ctx) + 
                     '&plan=' + encodeURIComponent(v54Plan) + 
                     '&method=' + encodeURIComponent('토스페이');
        
        console.log('[V55 success] V54 영업 URL redirect:', v54Url);
        
        setTimeout(function () {
            window.location.replace(v54Url);
        }, 800);
        
    } catch (e) {
        console.error('[V55 success] 예외:', e);
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('msg').textContent = '결제 검증 오류';
        document.getElementById('err').textContent = e.message;
        document.getElementById('hint').style.display = 'block';
        document.getElementById('hint').innerHTML = '잠시 후 홈으로 자동 이동';
        document.getElementById('btns').style.display = 'block';
        setTimeout(function () { goHome(); }, 5000);
    }
})();

function goHome() {
    window.location.replace(ZEUSTAROT_HOME);
}
</script>

</body>
</html>
