<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결제 완료 — V55</title>
<style>
html, body { background: #0a0612 !important; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; }
#paidEarlyOverlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(135deg, #0a0612 0%, #1a0a2e 100%);
    z-index: 9999999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px;
}
#paidEarlyOverlay .saju-symbol {
    font-size: 4rem; color: #FFD970;
    animation: paidSpin 2.5s linear infinite;
    filter: drop-shadow(0 0 18px rgba(255,217,112,0.6));
}
#paidEarlyOverlay .title {
    color: #FFD970; font-size: 1.2rem; font-weight: 900;
    letter-spacing: 0.04em; text-align: center; padding: 0 20px;
}
#paidEarlyOverlay .subtitle {
    color: rgba(255,255,255,0.6); font-size: 0.85rem;
    text-align: center; line-height: 1.6; margin-top: 4px; padding: 0 20px;
}
@keyframes paidSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.err { color: #f87171; font-size: 12px; margin-top: 16px; text-align: center; padding: 0 20px; display: none; }
.hint { color: #d4af37; font-size: 12px; margin-top: 12px; line-height: 1.6; padding: 10px 16px; background: rgba(212,175,55,0.12); border-radius: 6px; display: none; }
.btn { background: #d4af37; color: #0f1419; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; margin-top: 14px; display: none; }
</style>
</head>
<body>

<div id="paidEarlyOverlay">
<div class="saju-symbol" id="sym">✦</div>
<div class="title" id="ttl">신탁을 불러오는 중...</div>
<div class="subtitle" id="msg">결제 완료 — 잠시만 기다려주세요<br>곧 신탁이 펼쳐집니다</div>
<div class="err" id="err"></div>
<div class="hint" id="hint"></div>
<button class="btn" id="homeBtn" onclick="goHome()">홈으로</button>
</div>

<script>
var WORKER_URL = 'https://tarot-api-merged.omegafund01.workers.dev';
var ZEUSTAROT_HOME = 'https://zeustarot.com';

var V55_TO_V54_PLAN = {
        'entry':         'saju_basic',
        'premium':       'saju_premium',
        'saju_basic':    'saju_basic',
        'saju_premium':  'saju_premium'
    };

function detectCategoryFromReadingId(readingId) {
    if (!readingId) return null;
    var prefix = readingId.substring(0, 3);
    if (prefix === 'sj_') return 'saju';
    if (prefix === 'lv_') return 'love';
    if (prefix === 'st_') return 'stock';
    if (prefix === 'cr_') return 'crypto';
    if (prefix === 'gn_') return 'general';
    return null;
}

function detectPlanFromAmount(amount) {
    var amt = Number(amount);
    if (amt === 990)  return 'entry';
    if (amt === 4900) return 'premium';
    return null;
}

(async function () {
    var readingId = null;
    var signedAccessToken = null;
    var v55plan = null;

    try {
        var p = new URLSearchParams(window.location.search);

        var paymentKey = p.get('paymentKey');
        var orderId    = p.get('orderId');
        var amount     = p.get('amount');

        readingId         = p.get('rid') || p.get('readingId');
        signedAccessToken = p.get('token');

        v55plan = p.get('plan') || detectPlanFromAmount(amount);

        if (!paymentKey || !orderId || !amount) {
            throw new Error('토스 결제 파라미터 누락');
        }
        if (!readingId || !signedAccessToken) {
            throw new Error('readingId 또는 token URL 누락');
        }

        var confirmed = await Promise.race([
            fetch(WORKER_URL + '/v55/confirm-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    readingId:         readingId,
                    paymentKey:        paymentKey,
                    orderId:           orderId,
                    amount:            Number(amount),
                    signedAccessToken: signedAccessToken
                })
            }).then(function (res) { return res.json(); }),
            new Promise(function (_, reject) {
                setTimeout(function () { reject(new Error('TIMEOUT_15S')); }, 15000);
            })
        ]);

        if (!confirmed.valid) {
            throw new Error(confirmed.message || confirmed.error || '결제 검증 실패');
        }

        var category = detectCategoryFromReadingId(readingId);

        try {
            var readingRes = await fetch(
                WORKER_URL + '/v55/fetch-reading?rid=' + encodeURIComponent(readingId) +
                '&token=' + encodeURIComponent(signedAccessToken)
            );
            var readingData = await readingRes.json();
            if (readingData.category)          category = readingData.category;
            else if (readingData.categoryHint) category = readingData.categoryHint;

            if (!v55plan && readingData.plan) v55plan = readingData.plan;
        } catch (fetchErr) {
            console.warn('[V55 success] fetch-reading 결함 (무시):', fetchErr.message);
        }

        if (!v55plan)   v55plan = 'entry';
        if (!category)  category = 'saju';

        var isSajuCategory = (category === 'saju');

        var v54Plan;
        if (isSajuCategory) {
            v54Plan = V55_TO_V54_PLAN[v55plan] || 'saju_basic';
        } else {
            var cardTier = (v55plan === 'premium') ? 'premium' : 'basic';
            v54Plan = category + '_' + cardTier;
        }

        var v54Ctx = 'saju';
        if (category === 'love')    v54Ctx = 'love';
        if (category === 'stock')   v54Ctx = 'stock';
        if (category === 'crypto')  v54Ctx = 'crypto';
        if (category === 'general') v54Ctx = 'general';

        // 황금 화면 — index.html paidEarlyOverlay와 동일 디자인 (사주 ☯ / 카드 ✦)
        var _sym = isSajuCategory ? '☯' : '✦';
        var _title = isSajuCategory ? 'PRO 사주 신탁을 불러오는 중...' : '프리미엄 신탁을 불러오는 중...';
        var _symEl = document.getElementById('sym');
        var _ttlEl = document.getElementById('ttl');
        if (_symEl) _symEl.textContent = _sym;
        if (_ttlEl) _ttlEl.textContent = _title;

        console.log('[V55 success] 최종 분기:', {
            amount: amount, v55plan: v55plan, category: category,
            isSajuCategory: isSajuCategory, v54Plan: v54Plan, v54Ctx: v54Ctx, readingId: readingId
        });

        var v54Url = ZEUSTAROT_HOME + '/' +
                     '?paid=ok' +
                     '&ctx=' + encodeURIComponent(v54Ctx) +
                     '&plan=' + encodeURIComponent(v54Plan) +
                     '&rid=' + encodeURIComponent(readingId) +
                     '&token=' + encodeURIComponent(signedAccessToken) +
                     '&method=' + encodeURIComponent('토스페이');

        console.log('[V55 success] V54 영업 URL redirect:', v54Url);

        setTimeout(function () {
            window.location.replace(v54Url);
        }, 800);

    } catch (e) {
        console.error('[V55 success] 예외:', e);
        var sp = document.getElementById('sym'); if (sp) sp.style.animation = 'none';
        document.getElementById('ttl').textContent = '결제 검증 오류';
        document.getElementById('msg').style.display = 'none';
        document.getElementById('err').style.display = 'block';
        document.getElementById('err').textContent = e.message;
        document.getElementById('hint').style.display = 'block';
        document.getElementById('hint').innerHTML = '잠시 후 홈으로 자동 이동';
        document.getElementById('homeBtn').style.display = 'inline-block';
        setTimeout(function () { goHome(); }, 5000);
    }
})();

function goHome() {
    window.location.replace(ZEUSTAROT_HOME);
}
</script>

</body>
</html>
