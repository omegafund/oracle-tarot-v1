<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>점사 결과 — V55</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f1419;
    color: #d4d4d4;
    line-height: 1.7;
    padding: 16px;
}
.container { max-width: 760px; margin: 0 auto; }
h1 { color: #d4af37; font-size: 22px; margin-bottom: 8px; }
.subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }

.card {
    background: #1a1f2e;
    border: 1px solid #2c3447;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}

.spinner-large {
    width: 50px;
    height: 50px;
    border: 4px solid #2c3447;
    border-top-color: #d4af37;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 30px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

.status-msg {
    text-align: center;
    color: #8fa3c5;
    font-size: 14px;
    margin: 12px 0;
}
.status-detail {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
}
.elapsed-bar {
    margin: 16px auto 0;
    max-width: 280px;
    height: 4px;
    background: #2c3447;
    border-radius: 2px;
    overflow: hidden;
}
.elapsed-bar-fill {
    height: 100%;
    background: #d4af37;
    width: 0%;
    transition: width 0.5s linear;
}

.content-display {
    font-size: 14px;
    line-height: 1.8;
    color: #d4d4d4;
    white-space: pre-wrap;
    padding: 4px;
}

.error-box {
    background: #2a0a0a;
    border: 1px solid #c44;
    color: #f87171;
    padding: 16px;
    border-radius: 4px;
    text-align: center;
}
.error-box h3 { color: #f87171; margin-bottom: 8px; }
.error-box .msg { color: #d4d4d4; font-size: 13px; line-height: 1.6; }

.ceiling-box {
    background: #1a2030;
    border: 1px solid #d4af37;
    color: #d4af37;
    padding: 16px;
    border-radius: 4px;
    text-align: center;
}
.ceiling-box h3 { color: #d4af37; margin-bottom: 8px; }
.ceiling-box .msg { color: #d4d4d4; font-size: 13px; line-height: 1.6; }

.meta {
    color: #8fa3c5;
    font-size: 11px;
    border-top: 1px solid #2c3447;
    padding-top: 8px;
    margin-top: 16px;
}

.action-btn {
    background: #d4af37;
    color: #0f1419;
    border: none;
    padding: 10px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    margin-top: 12px;
}
</style>
</head>
<body>

<div class="container">

<h1>운명의 신탁</h1>
<p class="subtitle">V55.0 · 점사 결과</p>

<!-- 로딩 상태 -->
<div class="card" id="loadingCard">
    <div class="spinner-large"></div>
    <div class="status-msg" id="statusMsg">결과를 받아오는 중...</div>
    <div class="status-detail" id="statusDetail">상태: 시작</div>
    <!-- ★ ChatGPT #10: 90초 진행 표시 ★ -->
    <div class="elapsed-bar"><div class="elapsed-bar-fill" id="elapsedBar"></div></div>
</div>

<!-- 결과 표시 -->
<div class="card" id="resultCard" style="display:none">
    <h2 style="color: #d4af37; margin-bottom: 12px;" id="resultTitle">점사 결과</h2>
    <div class="content-display" id="contentDisplay"></div>
    <div class="meta" id="resultMeta"></div>
</div>

<!-- 일반 에러 -->
<div class="card" id="errorCard" style="display:none">
    <div class="error-box">
        <h3>점사 결과 받기 실패</h3>
        <div class="msg" id="errorMsg"></div>
        <button class="action-btn" onclick="window.location.reload()">다시 시도</button>
    </div>
</div>

<!-- ★ ChatGPT #10: 90초 ceiling 도달 안내 ★ -->
<div class="card" id="ceilingCard" style="display:none">
    <div class="ceiling-box">
        <h3>결과 생성이 지연되고 있습니다</h3>
        <div class="msg">
            점사 생성에 90초 이상 소요되고 있습니다.<br>
            ★ 결과는 정상 생성될 수 있습니다 ★<br>
            잠시 후 아래 버튼을 눌러 결과를 확인해주세요.
        </div>
        <button class="action-btn" onclick="window.location.reload()">결과 다시 확인</button>
    </div>
</div>

</div>

<script src="V55PaymentContext.js"></script>
<script>
// ════════════════════════════════════════════════════════════
// result-v55.html — V55.0 day4d-fix2 (ChatGPT #10 패치 적용)
// ════════════════════════════════════════════════════════════
//   • URL hash에서 readingId + token 읽기
//   • V55PaymentContext.pollReading()로 결과 받기
//   • status=READY 시 결과 표시
//   • BFCache 복귀 시 자동 재 polling
//   • ★ ChatGPT #10: 90초 polling ceiling ★
// ════════════════════════════════════════════════════════════

const MAX_POLLING_MS = 90 * 1000;  // ★ ChatGPT #10: 90초 ceiling ★

let activePoller = null;
let pollerInfo = null;     // {readingId, signedAccessToken}
let pollStartAt = null;    // ★ ceiling 카운트 시작 시점 ★
let progressTimer = null;  // ★ 진행 막대 업데이트 timer ★
let ceilingTimer = null;   // ★ 90초 강제 종료 timer (네트워크 끊김 대비) ★

// ════════════════════════════════════════════════════════════
// 초기 진입
// ════════════════════════════════════════════════════════════
(function init() {
    const urlParams = V55PaymentContext.readUrlParams();
    
    let readingId = urlParams.readingId;
    let signedAccessToken = urlParams.signedAccessToken;
    
    if (!readingId || !signedAccessToken) {
        const last = V55PaymentContext.readLastPayment();
        if (last) {
            readingId = readingId || last.readingId;
            signedAccessToken = signedAccessToken || last.signedAccessToken;
        }
    }
    
    if (!readingId || !signedAccessToken) {
        showError('readingId 또는 signedAccessToken 누락 — URL에 #rid=xxx&token=xxx 필요');
        return;
    }
    
    pollerInfo = { readingId: readingId, signedAccessToken: signedAccessToken };
    startPolling();
})();

// ════════════════════════════════════════════════════════════
// Polling 시작 (★ ChatGPT #10 ceiling 포함 ★)
// ════════════════════════════════════════════════════════════
function startPolling() {
    if (activePoller) {
        activePoller.abort();
    }
    cleanupTimers();
    
    // ★ ChatGPT #10: ceiling 카운트 시작 시점 기록 ★
    pollStartAt = Date.now();
    
    document.getElementById('loadingCard').style.display = 'block';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('errorCard').style.display = 'none';
    document.getElementById('ceilingCard').style.display = 'none';
    document.getElementById('statusMsg').textContent = '결과를 받아오는 중...';
    document.getElementById('statusDetail').textContent = '상태: 시작';
    document.getElementById('elapsedBar').style.width = '0%';
    
    // ★ ChatGPT #10: 진행 막대 + ceiling 강제 종료 timer ★
    // 진행 막대는 500ms 마다 갱신, ceiling은 정확히 90초에 폴링 중단
    progressTimer = setInterval(updateProgressBar, 500);
    ceilingTimer = setTimeout(forceCeiling, MAX_POLLING_MS);
    
    activePoller = V55PaymentContext.pollReading({
        readingId:         pollerInfo.readingId,
        signedAccessToken: pollerInfo.signedAccessToken,
        
        onUpdate: function (data) {
            // ★ ChatGPT #10: onUpdate 시점에도 ceiling 체크 (이중 안전망) ★
            if (Date.now() - pollStartAt > MAX_POLLING_MS) {
                forceCeiling();
                return;
            }
            
            const statusText = {
                fetching:    'Gemini AI가 점사 중...',
                paid:        '결제 완료, 결과 생성 준비 중...',
                consumed:    '토큰 소비 완료, 결과 생성 중...',
                confirming:  '결제 검증 중...'
            }[data.status] || (data.status + ' 처리 중...');
            
            document.getElementById('statusMsg').textContent = statusText;
            document.getElementById('statusDetail').textContent = 
                '상태: ' + data.status + ' | 시도 ' + data.pollCount + '회 | ' + 
                data.retryAfterSec + '초 후 재시도';
        },
        
        onComplete: function (data) {
            cleanupTimers();
            displayResult(data);
        },
        
        onFail: function (data) {
            cleanupTimers();
            showError(data.message || data.error || '알 수 없는 오류');
        }
    });
}

// ════════════════════════════════════════════════════════════
// ★ ChatGPT #10: 진행 막대 업데이트 ★
// ════════════════════════════════════════════════════════════
function updateProgressBar() {
    if (!pollStartAt) return;
    const elapsed = Date.now() - pollStartAt;
    const pct = Math.min(100, (elapsed / MAX_POLLING_MS) * 100);
    document.getElementById('elapsedBar').style.width = pct + '%';
}

// ════════════════════════════════════════════════════════════
// ★ ChatGPT #10: 90초 ceiling 도달 — 강제 종료 ★
// ════════════════════════════════════════════════════════════
function forceCeiling() {
    if (activePoller) {
        activePoller.abort();
        activePoller = null;
    }
    cleanupTimers();
    
    document.getElementById('loadingCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('errorCard').style.display = 'none';
    document.getElementById('ceilingCard').style.display = 'block';
}

// ════════════════════════════════════════════════════════════
// Timer 청소 (★ ChatGPT #11: READY/FAILED/ceiling 시 즉시 정리 ★)
// ════════════════════════════════════════════════════════════
function cleanupTimers() {
    if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
    }
    if (ceilingTimer) {
        clearTimeout(ceilingTimer);
        ceilingTimer = null;
    }
}

// ════════════════════════════════════════════════════════════
// 결과 표시
// ════════════════════════════════════════════════════════════
function displayResult(data) {
    document.getElementById('loadingCard').style.display = 'none';
    document.getElementById('errorCard').style.display = 'none';
    document.getElementById('ceilingCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'block';
    
    const titleMap = {
        saju:       '사주 정밀 분석',
        love:       '연애운 분석',
        stock:      '주식 운세 분석',
        crypto:     '암호화폐 운세 분석',
        general:    '일반 운세'
    };
    document.getElementById('resultTitle').textContent = titleMap[data.category] || '점사 결과';
    
    document.getElementById('contentDisplay').textContent = data.content || '(빈 응답)';
    
    const completedAt = data.contentAt ? new Date(data.contentAt).toLocaleString('ko-KR') : '—';
    const charCount = data.content ? data.content.length : 0;
    document.getElementById('resultMeta').innerHTML = 
        '★ ' + data.category + ' / ' + data.feature + ' ★ · ' + 
        charCount.toLocaleString() + '자 · 완료: ' + completedAt + '<br>' +
        'Reading ID: <code>' + data.readingId + '</code>';
}

// ════════════════════════════════════════════════════════════
// 일반 에러 표시
// ════════════════════════════════════════════════════════════
function showError(message) {
    document.getElementById('loadingCard').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('ceilingCard').style.display = 'none';
    document.getElementById('errorCard').style.display = 'block';
    document.getElementById('errorMsg').textContent = message;
}

// ════════════════════════════════════════════════════════════
// ★ ChatGPT 추가 1: BFCache Recovery ★ — polling 자동 재시작
// ════════════════════════════════════════════════════════════
window.addEventListener('pageshow', function (event) {
    if (event.persisted) {
        console.log('[V55 result] pageshow persisted — polling 재시작 (ceiling 리셋)');
        
        if (pollerInfo) {
            startPolling();  // ★ ceiling 카운트 자동 리셋 ★
        } else {
            const urlParams = V55PaymentContext.readUrlParams();
            const last = V55PaymentContext.readLastPayment();
            
            if (urlParams.readingId && urlParams.signedAccessToken) {
                pollerInfo = {
                    readingId: urlParams.readingId,
                    signedAccessToken: urlParams.signedAccessToken
                };
                startPolling();
            } else if (last) {
                pollerInfo = {
                    readingId: last.readingId,
                    signedAccessToken: last.signedAccessToken
                };
                startPolling();
            }
        }
    }
});

// 페이지 떠날 때 ★ 완전 정리 ★ (★ ChatGPT #6 + #11 ★)
window.addEventListener('pagehide', function () {
    if (activePoller) {
        activePoller.abort();
    }
    cleanupTimers();
});
</script>

</body>
</html>
