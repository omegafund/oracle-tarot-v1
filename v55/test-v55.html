<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V55 검증 — Mock 결제 흐름</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f1419;
    color: #d4d4d4;
    line-height: 1.6;
    padding: 16px;
}
.container { max-width: 760px; margin: 0 auto; }
h1 { color: #d4af37; font-size: 22px; margin-bottom: 8px; }
h2 { color: #b08d3a; font-size: 16px; margin: 20px 0 8px; }
.subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }

.card {
    background: #1a1f2e;
    border: 1px solid #2c3447;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}

.field { margin-bottom: 12px; }
.field label { display: block; color: #8fa3c5; font-size: 12px; margin-bottom: 4px; }
.field input, .field select, .field textarea {
    width: 100%;
    background: #0f1419;
    color: #d4d4d4;
    border: 1px solid #2c3447;
    border-radius: 4px;
    padding: 8px;
    font-size: 13px;
}
.field textarea { min-height: 60px; resize: vertical; }

.btn {
    background: #d4af37;
    color: #0f1419;
    border: none;
    padding: 10px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    margin-right: 8px;
    margin-bottom: 8px;
}
.btn:disabled { 
    background: #2c3447 !important; 
    color: #555 !important; 
    cursor: not-allowed !important; 
    opacity: 0.5;
}
.btn.secondary { background: #5a7191; color: #fff; }
.btn.danger { background: #c44; color: #fff; }

.log {
    background: #0a0d13;
    border: 1px solid #2c3447;
    border-radius: 4px;
    padding: 10px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    max-height: 320px;
    overflow-y: auto;
    color: #8fa3c5;
    margin-top: 8px;
}
.log .ok { color: #4ade80; }
.log .err { color: #f87171; }
.log .info { color: #60a5fa; }
.log .warn { color: #fbbf24; }
.log .raw { color: #6b7280; }

.status-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
    margin-left: 8px;
}
.s-created { background: #5a7191; color: #fff; }
.s-paid    { background: #4ade80; color: #0f1419; }
.s-fetching { background: #fbbf24; color: #0f1419; }
.s-ready   { background: #d4af37; color: #0f1419; }
.s-failed  { background: #c44; color: #fff; }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
table td { padding: 4px 6px; border-bottom: 1px solid #2c3447; }
table td:first-child { color: #8fa3c5; width: 40%; }
table td:nth-child(2) { color: #d4d4d4; font-family: ui-monospace, monospace; word-break: break-all; }

.warning {
    background: #2a1f0a;
    border: 1px solid #d4af37;
    color: #d4af37;
    padding: 10px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 12px;
}
</style>
</head>
<body>

<div class="container">

<h1>V55 검증 환경 — Mock 결제 흐름</h1>
<p class="subtitle">
    Worker: <span id="workerUrl"></span><br>
    Page: <span id="pageUrl"></span>
</p>

<div class="warning">
    ⚠ <strong>Mock 검증 모드</strong>: 실제 결제 진행 X, V55 워커 흐름만 검증<br>
    토스 가짜 paymentKey → 토스 거부 응답이 ★ 정상 ★ 흐름
</div>

<!-- 입력 영역 -->
<div class="card">
    <h2>📝 점사 입력</h2>
    
    <div class="field">
        <label>Category</label>
        <select id="category">
            <option value="saju">saju (사주)</option>
            <option value="love">love (연애)</option>
            <option value="stock">stock (주식)</option>
            <option value="crypto">crypto (암호화폐)</option>
            <option value="general">general (일반)</option>
        </select>
    </div>
    
    <div class="field">
        <label>Feature</label>
        <select id="feature">
            <option value="basic">basic (990원)</option>
            <option value="premium">premium (4900원)</option>
        </select>
    </div>
    
    <div class="field">
        <label>Question</label>
        <textarea id="question">V55 Day 4d Phase 3 Mock 검증 — 올해 운세는 어떻습니까?</textarea>
    </div>
    
    <div class="field">
        <label>Saju Input (사주 카테고리만)</label>
        <input id="sajuYear"   placeholder="year (예: 1962)" value="1962" type="number">
        <input id="sajuMonth"  placeholder="month (1-12)"     value="12"   type="number" style="margin-top:4px">
        <input id="sajuDay"    placeholder="day (1-31)"        value="10"   type="number" style="margin-top:4px">
        <input id="sajuHour"   placeholder="hour (0-23)"       value="7"    type="number" style="margin-top:4px">
    </div>
    
    <button class="btn" onclick="step1Create()">Step 1: Create Reading</button>
    <button class="btn secondary" onclick="step2MockConfirm()" id="btn2" disabled>Step 2: Mock Confirm (토스 거부 예상)</button>
    <button class="btn secondary" onclick="step3Poll()" id="btn3" disabled>Step 3: Polling 시작</button>
    <button class="btn danger" onclick="resetAll()">Reset</button>
</div>

<!-- 현재 상태 -->
<div class="card">
    <h2>📊 현재 상태 <span id="statusBadge"></span></h2>
    <table id="stateTable">
        <tr><td>readingId</td>         <td id="s-readingId">—</td></tr>
        <tr><td>orderId</td>           <td id="s-orderId">—</td></tr>
        <tr><td>amount</td>            <td id="s-amount">—</td></tr>
        <tr><td>category</td>          <td id="s-category">—</td></tr>
        <tr><td>feature</td>           <td id="s-feature">—</td></tr>
        <tr><td>signedAccessToken</td> <td id="s-token">—</td></tr>
        <tr><td>confirmAttempts</td>   <td id="s-confirmAttempts">—</td></tr>
        <tr><td>pollCount</td>         <td id="s-pollCount">—</td></tr>
        <tr><td>contentReady</td>      <td id="s-contentReady">—</td></tr>
    </table>
</div>

<!-- 결과 영역 -->
<div class="card" id="contentCard" style="display:none">
    <h2>📜 Gemini 결과</h2>
    <div id="contentDisplay" style="font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: #d4d4d4; max-height: 400px; overflow-y: auto; padding: 10px; background: #0a0d13; border-radius: 4px;"></div>
    <div style="margin-top: 8px; font-size: 11px; color: #8fa3c5;" id="contentMeta"></div>
</div>

<!-- 로그 영역 -->
<div class="card">
    <h2>📋 로그</h2>
    <div class="log" id="log"></div>
</div>

</div>

<script src="V55PaymentContext.js"></script>
<script>
// ════════════════════════════════════════════════════════════
// 페이지 초기화
// ════════════════════════════════════════════════════════════
document.getElementById('workerUrl').textContent = V55PaymentContext.WORKER_URL;
document.getElementById('pageUrl').textContent = window.location.href;

let currentReading = null;
let currentPoller = null;
let confirmedData = null;

// BFCache 자동 복귀
V55PaymentContext.setupBFCacheRecovery(function (restoreInfo) {
    log(`★ BFCache 복귀 감지: ${restoreInfo.source}`, 'info');
    log(`  readingId: ${restoreInfo.readingId}`, 'raw');
    log(`  source: ${restoreInfo.source}`, 'raw');
});

// ════════════════════════════════════════════════════════════
// Step 1: createReading
// ════════════════════════════════════════════════════════════
async function step1Create() {
    log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'raw');
    log('Step 1: createReading 시작', 'info');
    
    const category = document.getElementById('category').value;
    const feature = document.getElementById('feature').value;
    const question = document.getElementById('question').value;
    
    const input = { category, feature, question };
    
    if (category === 'saju') {
        input.sajuInput = {
            year:     parseInt(document.getElementById('sajuYear').value, 10),
            month:    parseInt(document.getElementById('sajuMonth').value, 10),
            day:      parseInt(document.getElementById('sajuDay').value, 10),
            hour:     parseInt(document.getElementById('sajuHour').value, 10),
            calendar: 'solar',
            gender:   '남'
        };
    } else {
        // 타로 카테고리 — 카드 3장 자동 생성
        input.selectedCards = [
            Math.floor(Math.random() * 78),
            Math.floor(Math.random() * 78),
            Math.floor(Math.random() * 78)
        ];
    }
    
    log(`입력: ${JSON.stringify(input).substring(0, 100)}...`, 'raw');
    
    try {
        const data = await V55PaymentContext.createReading(input);
        currentReading = data;
        
        log(`✅ createReading 성공`, 'ok');
        log(`  readingId: ${data.readingId}`, 'raw');
        log(`  amount: ${data.amount}원`, 'raw');
        log(`  isDuplicate: ${data.isDuplicate}`, 'raw');
        
        updateStateDisplay(data);
        document.getElementById('btn2').disabled = false;
    } catch (e) {
        log(`❌ createReading 실패: ${e.message}`, 'err');
    }
}

// ════════════════════════════════════════════════════════════
// Step 2: Mock confirmPayment
// ════════════════════════════════════════════════════════════
async function step2MockConfirm() {
    if (!currentReading) {
        log('★ Step 1 먼저 실행 필요', 'warn');
        return;
    }
    
    log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'raw');
    log('Step 2: Mock confirmPayment (★ 토스 거부 응답 기대 ★)', 'info');
    
    try {
        const data = await V55PaymentContext.confirmPayment({
            readingId:         currentReading.readingId,
            paymentKey:        'mock_payment_key_' + Date.now(),
            orderId:           currentReading.orderId,
            amount:            currentReading.amount,
            signedAccessToken: currentReading.signedAccessToken
        });
        
        confirmedData = data;
        
        if (data.valid === false) {
            log(`★ 예상된 결과 ★: 토스 거부 응답`, 'warn');
            log(`  error: ${data.error}`, 'raw');
            log(`  message: ${data.message}`, 'raw');
            log(`  → ★ V55 confirm-payment 엔드포인트 정상 작동 ★`, 'ok');
            log(`  → ★ 토스 API 호출 정상 ★`, 'ok');
            log(`  → Phase 4에서 실제 결제 통합 시 정상 흐름`, 'info');
            
            // ★ V55.0 1순위 수정: Step 3 항상 활성화 (사장님 폴링 흐름 검증 가능) ★
            document.getElementById('btn3').disabled = false;
        } else if (data.valid === true) {
            log(`✅ 정상 응답 (가능성 0 — 토스가 가짜 paymentKey 수락한 경우)`, 'ok');
            log(`  status: ${data.status}`, 'raw');
            log(`  → Step 3: Polling 가능`, 'info');
            document.getElementById('btn3').disabled = false;
        } else {
            // ★ V55.0 1순위 수정: 예상치 못한 응답 처리 ★
            log(`⚠ 예상치 못한 응답 형식: ${JSON.stringify(data).substring(0, 200)}`, 'warn');
            document.getElementById('btn3').disabled = false;
        }
    } catch (e) {
        log(`❌ Mock confirmPayment 실패: ${e.message}`, 'err');
        // ★ V55.0 1순위 수정: 네트워크 오류여도 Step 3 활성화 (재시도 가능) ★
        document.getElementById('btn3').disabled = false;
    }
}

// ════════════════════════════════════════════════════════════
// Step 3: Polling
// ════════════════════════════════════════════════════════════
function step3Poll() {
    if (!currentReading) {
        log('★ Step 1 먼저 실행 필요', 'warn');
        return;
    }
    
    log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'raw');
    log('Step 3: pollReading 시작', 'info');
    
    if (currentPoller) {
        currentPoller.abort();
        log('이전 poller 중단', 'warn');
    }
    
    currentPoller = V55PaymentContext.pollReading({
        readingId:         currentReading.readingId,
        signedAccessToken: currentReading.signedAccessToken,
        
        onUpdate: function (data) {
            log(`Polling [${data.status}] count=${data.pollCount} retry=${data.retryAfterSec}s`, 'raw');
            updateStateDisplay({ ...currentReading, ...data });
        },
        
        onComplete: function (data) {
            log(`★ READY: content 받음 (${data.content?.length || 0}자) ★`, 'ok');
            updateStateDisplay({ ...currentReading, ...data });
            displayContent(data);
        },
        
        onFail: function (data) {
            log(`★ 실패: ${data.error || 'unknown'} - ${data.message || 'no message'}`, 'err');
            updateStateDisplay({ ...currentReading, status: data.status || 'failed' });
        }
    });
}

// ════════════════════════════════════════════════════════════
// 상태 표시 헬퍼
// ════════════════════════════════════════════════════════════
function updateStateDisplay(data) {
    document.getElementById('s-readingId').textContent = data.readingId || '—';
    document.getElementById('s-orderId').textContent = data.orderId || '—';
    document.getElementById('s-amount').textContent = (data.amount || '—') + '원';
    document.getElementById('s-category').textContent = data.category || '—';
    document.getElementById('s-feature').textContent = data.feature || '—';
    document.getElementById('s-token').textContent = (data.signedAccessToken || '—').substring(0, 32) + '...';
    document.getElementById('s-confirmAttempts').textContent = data.confirmAttempts !== undefined ? data.confirmAttempts : '—';
    document.getElementById('s-pollCount').textContent = data.pollCount !== undefined ? data.pollCount : '—';
    document.getElementById('s-contentReady').textContent = data.contentReady === true ? '✅' : (data.contentReady === false ? '❌' : '—');
    
    const badge = document.getElementById('statusBadge');
    if (data.status) {
        badge.textContent = data.status;
        badge.className = 'status-badge s-' + data.status.replace(/[^a-z]/g, '');
    }
}

function displayContent(data) {
    document.getElementById('contentCard').style.display = 'block';
    document.getElementById('contentDisplay').textContent = data.content || '(빈 응답)';
    document.getElementById('contentMeta').innerHTML = 
        `Category: ${data.category} / Feature: ${data.feature} / 글자수: ${data.content?.length || 0} / 생성 시간: ${data.contentAt ? new Date(data.contentAt).toLocaleString('ko-KR') : '—'}`;
}

function resetAll() {
    currentReading = null;
    confirmedData = null;
    if (currentPoller) currentPoller.abort();
    currentPoller = null;
    
    document.getElementById('btn2').disabled = true;
    document.getElementById('btn3').disabled = true;
    document.getElementById('contentCard').style.display = 'none';
    
    document.querySelectorAll('#stateTable td:nth-child(2)').forEach(td => td.textContent = '—');
    document.getElementById('statusBadge').textContent = '';
    document.getElementById('statusBadge').className = '';
    
    log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'raw');
    log('🔄 Reset 완료', 'info');
}

// ════════════════════════════════════════════════════════════
// 로그 헬퍼
// ════════════════════════════════════════════════════════════
function log(msg, type) {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString('ko-KR');
    const cls = type || 'raw';
    el.innerHTML += `<div class="${cls}">[${time}] ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
}

log('V55 검증 페이지 로드 완료', 'ok');
log(`Worker: ${V55PaymentContext.WORKER_URL}`, 'raw');
log('Step 1 → Step 2 → Step 3 순서로 진행하세요', 'info');
</script>

</body>
</html>
